<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./CSS/EXCERCISE-CSS-login-page.css">
</head>
<body>
    <div>
        <h1>Login</h1>
        
        <form >
            <input type="email" placeholder="E-mail">

            <input type="password" placeholder="Password">

            <button>Sign In</button>
        </form>

        <p class="forgot-password"><a href="https://www.youtube.com/" target="_blank">Forgot your password?</a></p>
    </div>
    <footer>Don't have an account? <a href="https://www.youtube.com/" target="_blank" style="color: white;">Sign up here!</a></footer>
</body>
</html>
